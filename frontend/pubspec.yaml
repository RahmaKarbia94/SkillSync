name: articulate_go_app
description: Client for SkillSync, the AI-powered soft-skills assessment platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  http: ^1.2.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_webrtc: ^0.11.7
  permission_handler: ^11.3.1
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true